spring:
  application:
    name: facebook-clone-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/facebookclone}
    username: ${SPRING_DATASOURCE_USERNAME:fbclone}
    password: ${SPRING_DATASOURCE_PASSWORD:fbclone}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Override in production via APP_JWT_SECRET. Must be at least 32 characters for HS256.
    secret: ${APP_JWT_SECRET:change-me-in-production-facebook-clone-2018-demo-secret-key}
    ttl-seconds: ${APP_JWT_TTL_SECONDS:86400}
  media:
    # Where uploads are written. The compose stack mounts a volume here.
    dir: ${APP_MEDIA_DIR:./uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

logging:
  level:
    com.facebookclone: INFO
    org.hibernate.SQL: WARN

---
# Local development without Docker: in-memory H2, no Postgres needed.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:facebookclone;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
