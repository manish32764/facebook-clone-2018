<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Facebook Clone Flow Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbook with two-level tabs. A dark title bar, a coloured strip of main tabs (folder style, the open one joins the sub-tab row), then a white row of sub-tabs. Each section gets the full page width. Each flow is a stack of colour-coded "lanes" (UI → HTTP → Java → DB) that mirror the request path. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --ink: #152033;
  --muted: #5e6879;
  --line: #e2e7ee;
  --accent: #0f766e;
  --accent-ink: #ffffff;
  --accent-soft: #e6f4f2;
  --lane-ui: #0e8a7a;
  --lane-http: #b45309;
  --lane-java: #c2410c;
  --lane-db: #6d45c9;
  --lane-key: #2f5bd3;
  --lane-misc: #5e6879;
  --code-bg: #eef2f6;
  --ok: #15803d;
  --warn: #b45309;
  --info: #2f5bd3;
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --band: linear-gradient(120deg, #0b5f59 0%, #0f766e 55%, #11877c 100%);
  --band-ink: #0f766e;
  --appbar: #0d1726;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 4px 16px rgba(16, 24, 40, .08);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121a; --surface: #151c27; --surface-2: #19212d; --ink: #e7ebf1; --muted: #9aa4b5; --line: #263041;
    --accent: #3fc8b5; --accent-ink: #062320; --accent-soft: #12302d;
    --lane-ui: #3cc4b0; --lane-http: #e9a23b; --lane-java: #f07a45; --lane-db: #a98bf2; --lane-key: #7fa2ff; --lane-misc: #9aa4b5;
    --code-bg: #1f2836; --ok: #4cc77f; --warn: #e9a23b; --info: #7fa2ff;
    --band: linear-gradient(120deg, #083f3b 0%, #0b5550 60%, #0e6660 100%); --band-ink: #3fc8b5; --appbar: #080c13;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 4px 16px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121a; --surface: #151c27; --surface-2: #19212d; --ink: #e7ebf1; --muted: #9aa4b5; --line: #263041;
  --accent: #3fc8b5; --accent-ink: #062320; --accent-soft: #12302d;
  --lane-ui: #3cc4b0; --lane-http: #e9a23b; --lane-java: #f07a45; --lane-db: #a98bf2; --lane-key: #7fa2ff; --lane-misc: #9aa4b5;
  --code-bg: #1f2836; --ok: #4cc77f; --warn: #e9a23b; --info: #7fa2ff;
  --band: linear-gradient(120deg, #083f3b 0%, #0b5550 60%, #0e6660 100%); --band-ink: #3fc8b5; --appbar: #080c13;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 4px 16px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 24px; }
.content { min-width: 0; padding-block: 24px 64px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 700; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 80ch; }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--accent); }

header.top { display: grid; gap: 12px; margin-bottom: 24px; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--font-mono); font-size: 12.5px; }
.path span.n { padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; }
.path .arrow { color: var(--muted); }
.c-ui { color: var(--lane-ui); } .c-http { color: var(--lane-http); } .c-java { color: var(--lane-java); } .c-db { color: var(--lane-db); }
.c-key { color: var(--lane-key); } .c-misc { color: var(--lane-misc); }

.save-state { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.save-state .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.save-state[data-s="saved"] .dot { background: var(--ok); }
.save-state[data-s="saving"] .dot { background: var(--warn); }

/* Title bar */
.appbar { background: #262b33; color: #e8ebf0; }
.appbar .in, .maintabs .in, .subtabs .in { max-width: 1480px; margin: 0 auto; padding-inline: 24px; }
.appbar .in { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding-block: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: #fff; }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: #9aa3b4; margin-left: 10px; }
.appbar .save-state { color: #b7becb; font-size: 12.5px; }

/* Main tabs: coloured strip, folder-style tabs */
.navwrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 1px 0 var(--line); }
.maintabs { background: var(--band); }
.maintabs .in { display: flex; gap: 4px; padding-top: 18px; overflow-x: auto; scrollbar-width: none; }
.maintabs .in::-webkit-scrollbar, .subtabs .in::-webkit-scrollbar { display: none; }
.mtab { font: inherit; font-size: 16px; font-weight: 500; color: #fff; background: transparent; border: 0; border-radius: 4px 4px 0 0; padding: 13px 20px 14px; display: flex; gap: 9px; align-items: center; cursor: pointer; white-space: nowrap; }
.mtab:hover { background: rgba(255,255,255,.12); }
.mtab svg { width: 22px; height: 22px; flex: none; }
.mtab[aria-selected="true"] { background: var(--surface); color: var(--band-ink); }
.mtab:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }

/* Sub-tabs: white row */
.subtabs { background: var(--surface); }
.subtabs .in { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 60px; align-items: center; }
.stab { font: inherit; font-size: 14.5px; color: var(--ink); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 18px 14px 16px; display: flex; gap: 8px; align-items: center; cursor: pointer; white-space: nowrap; }
.stab:hover { color: var(--band-ink); }
.stab[aria-selected="true"] { color: var(--band-ink); border-bottom-color: var(--band-ink); font-weight: 500; }
.stab .n { font-family: var(--font-mono); font-size: 12px; opacity: .7; }
.stab svg { width: 16px; height: 16px; flex: none; }
.btn { font: inherit; font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.pager span:empty { flex: 1; }
.pill { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--code-bg); color: var(--muted); white-space: nowrap; }
.pill[data-st="In progress"] { color: var(--warn); }
.pill[data-st="Submitted"] { color: var(--accent); }
.pill[data-st="Reviewed"] { color: var(--ok); }

section.panel { display: grid; gap: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 12px; min-width: 0; }
.lead { font-size: 16.5px; }
.muted { color: var(--muted); }

ol.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 10px; counter-reset: s; }
ol.steps li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
ol.steps li.done { opacity: 0.72; }
ol.steps li.done .t { text-decoration: line-through; text-decoration-color: var(--muted); }
ol.steps input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
ol.steps .t { font-weight: 600; }
ol.steps .d { color: var(--muted); font-size: 14px; }

.toolkit { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.toolkit .card { padding: 16px; gap: 6px; align-content: start; }
pre { margin: 0; background: var(--code-bg); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }

.scenario { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.scenario .card { padding: 16px; gap: 6px; align-content: start; }

.lane { display: grid; grid-template-columns: 6px 1fr; gap: 14px; min-width: 0; }
.lane .bar { border-radius: 3px; background: currentColor; }
.lane .body { display: grid; gap: 6px; min-width: 0; padding-block: 2px; align-content: start; }
.lane label { font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; color: var(--ink); }
.lane .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
.lane .hint { font-size: 13.5px; color: var(--muted); }
textarea { width: 100%; min-height: 110px; resize: vertical; font-family: var(--font-mono); font-size: 13px; line-height: 1.55; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
textarea:disabled { opacity: 0.7; }
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 24px 28px; }
.lanes .lane.wide { grid-column: 1 / -1; }

.statusbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
select { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

.example dl { margin: 0; display: grid; gap: 14px; }
.example dt { font-weight: 600; }
.example dd { margin: 4px 0 0; font-family: var(--font-mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }

.bottom-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 22px; align-items: start; }
.change { border-style: dashed; }
.change .head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.lock { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--code-bg); color: var(--muted); }
.lock.open { color: var(--ok); }
.change ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* Assignment tickets */
ol.flowline { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.tk-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
.ticket { gap: 0; padding: 0; }
.ticket > summary { list-style: none; cursor: pointer; padding: 18px 56px 18px 20px; display: grid; gap: 8px; position: relative; border-radius: 10px; }
.ticket > summary::-webkit-details-marker { display: none; }
.ticket > summary:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.ticket > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ticket[open] > summary { border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; }
.t-toggle { position: absolute; right: 18px; top: 20px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.t-toggle::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
.ticket[open] .t-toggle::before { transform: translateY(2px) rotate(-135deg); }
.t-body { padding: 18px 20px 20px; display: grid; gap: 16px; min-width: 0; }
.tk-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.tk-actions { display: flex; gap: 8px; }
.tk-btn { font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tk-btn:hover { border-color: var(--accent); }
.tk-grid { gap: 12px; }
.mock-wrap { margin: 0; display: grid; gap: 8px; min-width: 0; }
.contract { background: var(--code-bg); border-radius: 8px; padding: 12px 14px; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.part { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.part-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.part-head .muted { font-size: 13px; }
.part-tag { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; color: var(--accent-ink); }
.pa { border-top: 3px solid var(--lane-ui); } .pa .part-tag { background: var(--lane-ui); }
.pb { border-top: 3px solid var(--lane-java); } .pb .part-tag { background: var(--lane-java); }

/* UI mockups: drawn in the app's own 2018 Facebook look, so they stay light in both themes on purpose */
:root { --fb-bg: #e9ebee; --fb-card: #ffffff; --fb-line: #dddfe2; --fb-blue: #4267b2; --fb-blue-soft: #e7f0fd; --fb-ink: #1d2129; --fb-muted: #606770; --fb-green: #42b72a; --fb-red: #d93025; --fb-bar: #d8e3f7; }
.mock { background: var(--fb-bg); color: var(--fb-ink); border-radius: 10px; padding: 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; font-family: Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.4; overflow-x: auto; }
.mock p { margin: 6px 0; max-width: none; }
.fb-panel { flex: 1 1 260px; min-width: 0; max-width: 420px; display: grid; gap: 8px; }
.fb-panel.wide { max-width: 760px; flex-basis: 100%; }
.fb-cap { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fb-muted); }
.fb-card { background: var(--fb-card); border: 1px solid var(--fb-line); border-radius: 4px; padding: 10px 12px; display: grid; gap: 8px; }
.fb-ghost { color: var(--fb-muted); font-style: italic; }
.fb-row { display: flex; gap: 8px; align-items: center; }
.fb-av { width: 32px; height: 32px; border-radius: 50%; color: #fff; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.fb-menu .fb-av, .fb-notif .fb-av { width: 24px; height: 24px; font-size: 9px; }
.fb-muted { color: var(--fb-muted); font-size: 12px; }
.fb-link { color: var(--fb-blue); text-decoration: none; cursor: default; }
.fb-list { display: grid; gap: 10px; }
.fb-list > div + div { border-top: 1px solid var(--fb-line); padding-top: 10px; }
.fb-input { border: 1px solid var(--fb-line); border-radius: 4px; padding: 7px 9px; background: #fff; }
.fb-ph { color: #90949c; }
.fb-caret { display: inline-block; width: 1px; height: 14px; background: var(--fb-ink); vertical-align: -2px; margin-left: 1px; }
.fb-menu { border: 1px solid var(--fb-line); border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.12); background: #fff; display: grid; margin-top: -4px; }
.fb-menu > div { display: flex; gap: 8px; align-items: center; padding: 6px 10px; }
.fb-menu > div.on { background: var(--fb-blue-soft); }
.fb-notif { grid-template-columns: auto 1fr; background: var(--fb-blue-soft); }
.fb-btn { display: inline-block; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--fb-line); background: #f5f6f7; font-weight: 600; font-size: 12px; color: var(--fb-ink); }
.fb-btn.primary { background: var(--fb-blue); border-color: var(--fb-blue); color: #fff; }
.fb-btn.danger { color: var(--fb-red); }
.fb-btn.sm { padding: 3px 9px; font-size: 11.5px; }
.fb-select { display: inline-block; border: 1px solid var(--fb-line); border-radius: 4px; padding: 3px 8px; background: #f5f6f7; font-size: 12px; color: var(--fb-ink); }
.fb-bar { position: relative; border: 1px solid var(--fb-line); border-radius: 4px; height: 30px; overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
.fb-bar span { position: absolute; inset: 0 auto 0 0; background: #eceef1; }
.fb-bar.mine { border-color: var(--fb-blue); }
.fb-bar.mine span { background: var(--fb-bar); }
.fb-bar em, .fb-bar i { position: relative; font-style: normal; font-weight: 600; }
.fb-sched { border: 1px solid var(--fb-line); border-radius: 4px; padding: 8px 10px; display: grid; gap: 6px; background: #f5f6f7; }
.fb-chat { background: #fff; border: 1px solid var(--fb-line); border-radius: 6px; overflow: hidden; display: grid; }
.fb-chat-head { background: var(--fb-blue); color: #fff; font-weight: 700; padding: 6px 10px; display: flex; gap: 8px; align-items: center; }
.fb-chat-head .fb-av { width: 22px; height: 22px; font-size: 9px; }
.fb-msgs { padding: 10px; display: grid; gap: 6px; }
.bub { max-width: 80%; padding: 6px 10px; border-radius: 16px; position: relative; }
.bub.them { background: #f1f0f0; justify-self: start; }
.bub.me { background: #0084ff; color: #fff; justify-self: end; }
.bub .quote { background: rgba(255,255,255,.22); border-left: 3px solid #fff; border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; font-size: 12px; }
.fb-hover { position: absolute; right: -66px; top: 4px; font-size: 11px; background: #fff; border: 1px solid var(--fb-line); border-radius: 10px; padding: 1px 7px; color: var(--fb-muted); white-space: nowrap; }
.fb-replying { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--fb-line); border-left: 3px solid var(--fb-blue); padding: 6px 10px; background: #f5f6f7; }
.fb-chat > .fb-input { border: 0; border-top: 1px solid var(--fb-line); border-radius: 0; color: #90949c; }
.fb-toggle { width: 34px; height: 20px; border-radius: 10px; background: #ccd0d5; position: relative; flex: none; }
.fb-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.fb-toggle.on { background: var(--fb-blue); }
.fb-toggle.on::after { left: 16px; }
.fb-dialog { box-shadow: 0 6px 18px rgba(0,0,0,.15); }
.fb-dialog del { color: var(--fb-red); }
.fb-dialog ins { color: var(--fb-green); text-decoration: none; font-weight: 700; }
.fb-radio { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #8d949e; flex: none; }
.fb-radio.on { border: 4px solid var(--fb-blue); }
.fb-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fb-tile { background: #fff; border: 1px solid var(--fb-line); border-radius: 4px; padding: 6px; display: grid; gap: 2px; }
.fb-tile .cover { height: 54px; border-radius: 3px; margin-bottom: 4px; }
.fb-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.fb-table th { text-align: left; color: var(--fb-muted); font-weight: 600; border-bottom: 1px solid var(--fb-line); padding: 6px; }
.fb-table td { border-bottom: 1px solid var(--fb-line); padding: 6px; vertical-align: top; }
.fb-table tr.sel td { background: var(--fb-blue-soft); font-weight: 600; }
.fb-table td[colspan] { background: #fafbfc; }
.fb-table td[colspan] > * + * { margin-top: 6px; }
.fb-preview { border-left: 3px solid var(--fb-red); padding: 4px 8px; background: #fff; }
@media (max-width: 760px) { .split { grid-template-columns: minmax(0, 1fr); } .fb-hover { display: none; } }
.ticket { border-left: 4px solid var(--line); }
.ticket[data-st="In progress"] { border-left-color: var(--warn); }
.ticket[data-st="In review"] { border-left-color: var(--accent); }
.ticket[data-st="Done"] { border-left-color: var(--ok); }
.t-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.t-id { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.lvl { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
.lvl[data-l="Easy"] { color: var(--ok); }

/* ===== Polish layer ===== */
body { font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { letter-spacing: -0.015em; }
h2 { font-size: 22px; }
h3 { font-size: 16.5px; font-weight: 700; }
.eyebrow { font-size: 11.5px; letter-spacing: .1em; color: var(--accent); }
.muted { color: var(--muted); }
a { color: var(--accent); }

/* title bar */
.appbar { background: var(--appbar); }
.appbar .in { padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 18px; letter-spacing: -0.01em; }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #2dd4bf, #0f766e); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.brand .mark svg { width: 17px; height: 17px; color: #fff; }
.brand small { margin-left: 2px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.16); color: #93a0b4; font-size: 13px; }
.appbar .save-state { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); padding: 5px 12px; border-radius: 999px; color: #c3cad6; }

/* main tabs */
.navwrap { box-shadow: 0 1px 0 var(--line), 0 6px 18px -12px rgba(16,24,40,.25); }
.maintabs .in { gap: 6px; padding-top: 14px; }
.mtab { font-size: 15px; font-weight: 600; color: rgba(255,255,255,.86); border-radius: 12px 12px 0 0; padding: 12px 20px 13px; transition: background .15s, color .15s; }
.mtab:hover { background: rgba(255,255,255,.1); color: #fff; }
.mtab svg { width: 20px; height: 20px; }
.mtab[aria-selected="true"] { background: var(--surface); color: var(--band-ink); }

/* sub tabs */
.subtabs { border-bottom: 1px solid var(--line); }
.subtabs .in { gap: 2px; min-height: 54px; }
.stab { font-size: 14px; font-weight: 500; color: var(--muted); padding: 15px 14px 13px; border-bottom-width: 2.5px; transition: color .15s, border-color .15s; }
.stab:hover { color: var(--ink); }
.stab[aria-selected="true"] { color: var(--band-ink); font-weight: 600; }
.stab .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--code-bg); font-size: 11px; opacity: 1; color: var(--muted); }
.stab[aria-selected="true"] .n { background: var(--accent-soft); color: var(--band-ink); }

/* pills */
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--code-bg); color: var(--muted); letter-spacing: .01em; }
.pill[data-st="In progress"] { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.pill[data-st="Submitted"] { background: color-mix(in srgb, var(--info) 14%, transparent); color: var(--info); }
.pill[data-st="Reviewed"] { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }

/* layout + cards */
.content { padding-block: 28px 72px; }
section.panel { gap: 20px; }
.card { border-radius: var(--radius); border-color: var(--line); box-shadow: var(--shadow); padding: 22px 24px; }
.toolkit .card, .scenario .card { padding: 18px 20px; }
.toolkit .card h3 { display: flex; gap: 10px; align-items: center; }
pre { border-radius: 8px; border: 1px solid var(--line); }
code { border-radius: 5px; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 34px 36px; background:
  radial-gradient(900px 300px at 100% -20%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
  linear-gradient(180deg, var(--surface), var(--surface-2)); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr); gap: 32px; align-items: center; }
.hero h1 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 800; letter-spacing: -0.025em; margin-top: 8px; }
.hero .lead { color: var(--muted); font-size: 16px; margin-top: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--muted); }
.route { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.route .stop { padding: 14px 18px; display: grid; gap: 2px; position: relative; border-top: 3px solid currentColor; }
.route .stop + .stop { border-left: 1px solid var(--line); }
.route .stop + .stop::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; background: var(--surface); border-right: 1px solid var(--line); border-top: 1px solid var(--line); transform: translateY(-50%) rotate(45deg); }
.route .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
.route .v { color: var(--ink); font-weight: 600; font-size: 14.5px; }
.route .s { color: var(--muted); font-size: 12.5px; }

/* steps */
ol.steps { gap: 12px; }
ol.steps li { border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); transition: border-color .15s; }
ol.steps li:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
ol.steps input[type="checkbox"], ol.qs input { accent-color: var(--accent); }

/* lanes + inputs */
.lane .tag { padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, currentColor 12%, transparent); font-weight: 600; }
.lane .bar { width: 4px; border-radius: 4px; opacity: .9; }
.lane { grid-template-columns: 4px 1fr; }
textarea, select, input[type="url"] { background: var(--surface-2); border-color: var(--line); border-radius: 10px; transition: border-color .15s, box-shadow .15s, background .15s; }
textarea { padding: 11px 13px; }
textarea:hover, select:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
textarea:focus, select:focus, input[type="url"]:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
select { padding: 7px 12px; }

/* buttons */
.btn, .tk-btn { border-radius: 10px; padding: 8px 14px; font-weight: 600; box-shadow: var(--shadow); transition: border-color .15s, color .15s; }
.btn:hover, .tk-btn:hover { border-color: var(--accent); color: var(--accent); }
.pager { margin-top: 12px; padding-top: 20px; border-top: 1px solid var(--line); }

/* flow + change cards */
.mentor { border-color: color-mix(in srgb, var(--info) 35%, var(--line)); background: linear-gradient(180deg, color-mix(in srgb, var(--info) 4%, var(--surface)), var(--surface)); }
.change { border-style: dashed; border-width: 1.5px; box-shadow: none; background: var(--surface-2); }
.lock { border-radius: 999px; padding: 3px 10px; }
.lock.open { background: color-mix(in srgb, var(--ok) 14%, transparent); }

/* assignments */
.card.ticket { padding: 0; gap: 0; border-left-width: 4px; overflow: hidden; }
.ticket > summary:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
.ticket > summary { padding: 20px 60px 20px 22px; }
.ticket[open] { box-shadow: var(--shadow-lg); }
.t-id { color: var(--accent); font-weight: 600; }
.lvl { background: color-mix(in srgb, currentColor 10%, transparent); border-color: transparent; }
.chip { background: var(--surface-2); }
.contract { border: 1px solid var(--line); border-radius: 10px; }
.part { border-radius: 12px; background: var(--surface); }
.mock { border-radius: 12px; border: 1px solid var(--line); }

/* interview */
ol.qs li { padding: 9px 4px; }
.iv-head .pill { font-size: 11.5px; }

@media (max-width: 1000px) { .hero { grid-template-columns: minmax(0, 1fr); padding: 26px 22px; } }
@media (max-width: 700px) {
  .route { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .route .stop:nth-child(3) { border-left: 0; }
  .route .stop:nth-child(3)::before { display: none; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat b { font-size: 22px; }
  .card { padding: 18px; }
}
</style>

  { id: "flows", name: "Flows", items: FLOWS.map(f => f.key) },
  { id: "assignments", name: "Assignments", items: ["assignments"] },
  { id: "interview", name: "Interview prep", items: ["interview"] },
];
const tabs = [
  { id: "start", name: "Onboarding", icon: "check" },
  { id: "example", name: "Worked example", icon: "doc" },
  ...FLOWS.map((f, i) => ({ id: f.key, name: f.name, flow: true, num: i + 1 })),
  { id: "assignments", name: "All 9 tickets", icon: "doc" },
  { id: "interview", name: "Weeks 1–6", icon: "check" },
];
const groupOf = id => GROUPS.find(g => g.items.includes(id));
const lastInGroup = {};
const tabName = id => { const t = tabs.find(x => x.id === id); if (!t) return ""; const g = groupOf(id); return t.flow ? `Flow ${t.num}: ${t.name}` : g.items.length === 1 ? g.name : t.name; };
let active = "start";
try { const h = location.hash.slice(1); if (tabs.some(t => t.id === h)) active = h; else { const s = localStorage.getItem("wb-tab"); if (tabs.some(t => t.id === s)) active = s; } } catch (e) {}

function pillFor(t) {
  if (t.flow) { const st = state.flows[t.id].status; return `<span class="pill" data-st="${esc(st)}">${esc(st)}</span>`; }
  if (t.id === "start") { const done = Object.values(state.onboarding).filter(Boolean).length; return `<span class="pill" data-st="${done === ONBOARDING.length ? "Reviewed" : done ? "In progress" : "Not started"}">${done}/${ONBOARDING.length}</span>`; }
  if (t.id === "interview") { const total = INTERVIEW.reduce((n, w) => n + w.q.length, 0); const done = Object.values(state.interview.checked).filter(Boolean).length; return `<span class="pill" data-st="${done === total ? "Reviewed" : done ? "In progress" : "Not started"}">${done}/${total} ready</span>`; }
  return "";
}

function arrowKeys(container, sel, onPick) {
  container.querySelectorAll(sel).forEach((b, i, all) => b.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault(); const n = all[(i + (e.key === "ArrowRight" ? 1 : -1) + all.length) % all.length];
    onPick(n.dataset.go); const again = container.querySelector(`[data-go="${n.dataset.go}"]`); if (again) again.focus();
  }));
}

function renderTabs() {
  const g = groupOf(active);
  const main = document.getElementById("mainTabs");
  main.innerHTML = GROUPS.map(x => `<button type="button" role="tab" class="mtab" data-go="${x.id}" aria-selected="${x === g}" tabindex="${x === g ? 0 : -1}">${ico(x.id)}${esc(x.name)}</button>`).join("");
  main.querySelectorAll(".mtab").forEach(b => b.addEventListener("click", () => openGroup(b.dataset.go)));
  arrowKeys(main, ".mtab", openGroup);
  const sub = document.getElementById("subTabs");
  sub.innerHTML = g.items.map(id => { const t = tabs.find(x => x.id === id);
    return `<button type="button" role="tab" class="stab" data-go="${id}" aria-selected="${id === active}" tabindex="${id === active ? 0 : -1}">${t.flow ? `<span class="n">${t.num}</span>` : ico(t.icon)}${esc(t.name)} ${pillFor(t)}</button>`; }).join("");
  sub.querySelectorAll(".stab").forEach(b => b.addEventListener("click", () => select(b.dataset.go, true)));
  arrowKeys(sub, ".stab", id => select(id, true));
  const cur = sub.querySelector('[aria-selected="true"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
}
function openGroup(gid) { const g = GROUPS.find(x => x.id === gid); select(lastInGroup[gid] || g.items[0], true); }

function select(id, push) {
  if (!tabs.some(t => t.id === id)) id = "start";
  const changed = active !== id;
  active = id; lastInGroup[groupOf(id).id] = id;
  try { localStorage.setItem("wb-tab", id); } catch (e) {}
  if (push) { try { history.pushState(null, "", "#" + id); } catch (e) {} }
  renderTabs();
  document.querySelectorAll("section.panel").forEach(p => p.hidden = p.id !== "panel-" + id);
  if (changed) window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault(); select(a.getAttribute("href").slice(1), true);
});
window.addEventListener("popstate", () => { const h = location.hash.slice(1); if (h) select(h); });

function syncOnboarding() {
  document.querySelectorAll("#steps li").forEach(li => {
    const on = !!state.onboarding[li.dataset.i];

}
function syncInterview() {
  document.querySelectorAll("input[data-iv]").forEach(cb => cb.checked = !!state.interview.checked[cb.dataset.iv]);
  document.querySelectorAll("textarea[data-ivnote]").forEach(ta => {
    if (ta === document.activeElement) return;
    const v = state.interview.notes[ta.dataset.ivnote] || ""; if (ta.value !== v) ta.value = v;
  });
  INTERVIEW.forEach(w => {
    const done = w.q.filter((_, i) => state.interview.checked[w.week + "-" + i]).length;
    const el = document.getElementById("ivc-" + w.week);
    el.textContent = done + "/" + w.q.length + " ready";
    el.dataset.st = done === w.q.length ? "Reviewed" : done ? "In progress" : "Not started";
  });
}
function syncFlow(key) {
  const fs = state.flows[key];
  document.getElementById("st-" + key).value = fs.status;
  document.querySelectorAll(`textarea[data-flow="${key}"]`).forEach(ta => {
    if (ta === document.activeElement) return;
    const v = ta.dataset.mentor ? fs.mentor : (fs.answers[ta.dataset.field] || "");
    if (ta.value !== v) ta.value = v;
  });
  const lock = document.getElementById("lock-" + key);
  const open = fs.status === "Reviewed";
  lock.textContent = open ? "Unlocked: start this task" : "Unlocks when the flow is reviewed";
  lock.classList.toggle("open", open);
}

// ---------- persistence ----------
const timers = {};
function setSave(s, text) { document.querySelectorAll(".save-state").forEach(el => { el.dataset.s = s; el.querySelector("span:last-child").textContent = text; }); }
function docPayload(key) {
  return key === "onboarding" ? { items: state.onboarding } : key === "interview" ? state.interview : state.flows[key];
}
function docPath(key) {
  return key === "onboarding" ? "workbook/onboarding" : key === "interview" ? "workbook/interview" : "flows/" + key;
}

function queueSave(key) {
  clearTimeout(timers[key]);
  setSave("saving", "Saving…");
  timers[key] = setTimeout(() => save(key), 700);
}
async function save(key) {
  const body = JSON.parse(JSON.stringify(docPayload(key)));
  body.updatedAt = new Date().toISOString();
  if (mode === "db") {
    try { await db.doc(docPath(key)).set(body); setSave("saved", "All changes saved. Your mentor sees them live."); }
    catch (e) {
      if (e && e.code === "unavailable") { setTimeout(() => save(key), 1500 + Math.random() * 1000); return; }
      setSave("idle", "Couldn't save just now. Keep this tab open and try typing again.");
    }
  } else {
    try { localStorage.setItem("wb-" + key, JSON.stringify(body)); setSave("saved", "Saved in this browser only. Your mentor can't see these answers."); }
    catch (e) { setSave("idle", "This browser blocks saving. Copy your answers somewhere safe."); }
  }
}

function applyRemote(key, data) {
  if (!data) return;
  if (key === "onboarding") { state.onboarding = Object.assign({}, data.items || {}); syncOnboarding(); }
  else if (key === "interview") {
    const a = document.activeElement;
    const notes = Object.assign({}, data.notes || {});
    if (a && a.dataset && a.dataset.ivnote) notes[a.dataset.ivnote] = state.interview.notes[a.dataset.ivnote];
    state.interview = { checked: Object.assign({}, data.checked || {}), notes };
    syncInterview();
  }
  else {
    const fs = state.flows[key];
    const active = document.activeElement;
    const editing = active && active.dataset && active.dataset.flow === key ? active : null;
    fs.status = STATUSES.includes(data.status) ? data.status : fs.status;
    const answers = Object.assign({}, data.answers || {});
    if (editing && !editing.dataset.mentor) answers[editing.dataset.field] = fs.answers[editing.dataset.field];
    fs.answers = answers;
    fs.mentor = editing && editing.dataset.mentor ? fs.mentor : (data.mentor || "");
    syncFlow(key);
  }
  renderTabs();
}

function loadLocal() {
  for (const key of ["onboarding", "interview", ...FLOWS.map(f => f.key)]) {
    try { const raw = localStorage.getItem("wb-" + key); if (raw) applyRemote(key, JSON.parse(raw)); } catch (e) {}
  }
}

async function connect() {
  let ns = null;
  try { ns = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { ns = null; }
  if (!ns) { mode = "local"; loadLocal(); setSave("idle", "Saving in this browser only. Your mentor can't see these answers."); return; }
  db = ns; mode = "db";
  setSave("saved", "Connected. Answers save automatically and your mentor sees them live.");
  const sub = (key) => db.doc(docPath(key)).onSnapshot(
    snap => { if (snap.exists && !snap.metadata.hasPendingWrites) applyRemote(key, snap.data()); },
    () => setSave("idle", "Lost the connection. Reload the page to keep saving.")
  );
  sub("onboarding"); sub("interview"); FLOWS.forEach(f => sub(f.key));
}

renderPanels();
FLOWS.forEach(f => syncFlow(f.key));
syncOnboarding();
syncInterview();
select(active);
connect();
</script>
</body>
</html>
